##############################################################################
# render.yaml — Infrastructure-as-Code for Render.com
# This file must live at the ROOT of the GitHub repository.
#
# Repo root is: Pos_billing/
# Services are inside:  Pos_billing/pos-system/
#
# Deploy order: 1) PostgreSQL  2) Django  3) React
##############################################################################

services:

  # ─────────────────────────────────────────────────────────────────────────
  # 1. Django Backend (Web Service)
  # ─────────────────────────────────────────────────────────────────────────
  - type: web
    name: pos-django
    runtime: python
    rootDir: pos-system/backend-django
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --fake-initial --noinput && python manage.py seed_demo_users
    startCommand: bash start.sh
    plan: free
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: pos-django-nj3s.onrender.com,pos-frontend-fbaz.onrender.com,localhost,127.0.0.1
      - key: DATABASE_URL
        fromDatabase:
          name: pos-postgres
          property: connectionString
      - key: JWT_SECRET_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://pos-frontend-fbaz.onrender.com
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false

  # ─────────────────────────────────────────────────────────────────────────
  # 2. React Frontend (Static Site)
  # ─────────────────────────────────────────────────────────────────────────
  - type: web
    name: pos-frontend
    runtime: static
    rootDir: pos-system/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://pos-django-nj3s.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

##############################################################################
# PostgreSQL Managed Database
##############################################################################

databases:
  - name: pos-postgres
    plan: free
    databaseName: pos_system
    user: pos_user
